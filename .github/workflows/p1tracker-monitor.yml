name: p1tracker evening check

on:
  schedule:
    # 18:00 香港時間 = 10:00 UTC（Vercel Cron 免費方案每天只允許一次，
    # 已負責中午 13:00 那次；這裡補晚上那次）
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger KiDays monitor endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://kidaysweb.vercel.app/api/monitor/p1tracker"
